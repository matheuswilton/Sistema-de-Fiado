# Publica o site na InfinityFree sempre que a main e atualizada.
# Precisa dos secrets FTP_SERVER, FTP_USERNAME e FTP_PASSWORD (Settings > Secrets and variables > Actions).
name: Publicar na InfinityFree

on:
  push:
    branches: [main]
    paths:
      - "fiadofacil/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-infinityfree
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./fiadofacil/
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            config.local.php
            sql/**

      - name: Verificar se o site responde
        run: |
          for endereco in https://fiadofacil.free.je/login.php http://fiadofacil.free.je/login.php; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -A "Mozilla/5.0" "$endereco" || echo "sem resposta")
            echo "$endereco -> $codigo"
          done
          curl -s --max-time 25 -A "Mozilla/5.0" https://fiadofacil.free.je/dashboard.php | grep -o "Motivo:[^.]*" || echo "Banco: sem mensagem de erro de conexao"
        continue-on-error: true
